name: Render IA SinHumo

on:
  schedule:
    - cron: "30 5 * * *"   # 23:30 hora de Guatemala
    - cron: "30 7 * * *"   # 01:30 hora de Guatemala (reintento de pendientes)
    - cron: "15 9 * * *"   # 03:15 hora de Guatemala (reintento; GitHub suele atrasar los programados)
  workflow_dispatch:
    inputs:
      modo:
        description: "cola, archivo, ejemplo o muestra_voces"
        type: choice
        options: [archivo, cola, ejemplo, muestra_voces]
        default: archivo
      voz:
        description: "Voz de Edge para el modo ejemplo (por ejemplo es-MX-JorgeNeural)"
        type: string
        default: ""
      archivo:
        description: "Guion a renderizar en modo archivo (ruta dentro del repo)"
        type: string
        default: "ejemplos/hsf_blockbuster.json"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      ISH_TTS: ${{ vars.ISH_TTS || 'edge' }}
      ISH_VOICE: ${{ vars.ISH_VOICE }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias del sistema
        timeout-minutes: 15
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && ldconfig -p | grep -q libcairo.so.2; then
            echo "ffmpeg y cairo ya instalados"
          else
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg libcairo2
          fi
      - name: Fuentes Poppins
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          for f in Poppins-Bold Poppins-Medium; do
            sudo curl -sSL -o /usr/share/fonts/truetype/google-fonts/$f.ttf https://github.com/google/fonts/raw/main/ofl/poppins/$f.ttf
          done
          fc-cache -f
      - name: Dependencias de Python
        run: pip install edge-tts numpy pillow cairosvg
      - name: Asegurar release cola
        run: gh release view cola >/dev/null 2>&1 || gh release create cola --title "Cola de videos" --notes "Videos renderizados automaticamente"
      - name: Render
        run: python3 tools/run_render.py "${{ inputs.modo || 'cola' }}" "${{ inputs.voz }}" "${{ inputs.archivo }}"
